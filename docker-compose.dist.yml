# ============================================================
# Agente Virtual Musical — Distribuição (clientes)
# ============================================================
# Use este arquivo se você recebeu a solução pronta (sem código-fonte).
# A imagem já vem pré-compilada do Docker Hub.
#
# WAHA     — WhatsApp HTTP API     (porta 3001)
# servidor — FastAPI + pipeline    (porta 8002)
# ============================================================
# Iniciar:   docker compose -f docker-compose.dist.yml up -d
# Parar:     docker compose -f docker-compose.dist.yml down
# Atualizar: docker compose -f docker-compose.dist.yml pull && docker compose -f docker-compose.dist.yml up -d
# Logs:      docker compose -f docker-compose.dist.yml logs -f servidor
# Dashboard: http://localhost:3001/dashboard
# ============================================================

services:

  # --- WAHA (WhatsApp HTTP API) ---
  waha:
    image: devlikeapro/waha:noweb-2026.3.2
    platform: linux/amd64
    entrypoint: ["/entrypoint.sh"]   # bypassa o tini da imagem (incompatível com este sistema)
    init: true                        # Docker provê seu próprio init (evita processos zumbi)
    container_name: waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-minhaChave123}

      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_API_KEY:-minhaChave123}

      WHATSAPP_HOOK_URL: http://servidor:8002/webhook
      WHATSAPP_HOOK_EVENTS: "message,session.status"

      WHATSAPP_DEFAULT_ENGINE: NOWEB

      # NOWEB store — necessário para resolver LID → telefone
      WHATSAPP_NOWEB_STORE_ENABLED: "true"
      WHATSAPP_NOWEB_STORE_FULL_SYNC: "true"

      WHATSAPP_START_SESSION: default

      TZ: America/Sao_Paulo

    volumes:
      - waha_sessions:/app/.sessions

    networks:
      - agente_net

  # --- Servidor Python (FastAPI + pipeline) ---
  servidor:
    image: iamlucb/gpteco:latest   # imagem pré-compilada do Docker Hub
    container_name: servidor
    restart: unless-stopped
    init: true                     # evita processos zumbi (ffmpeg/yt-dlp)
    ports:
      - "8002:8002"

    env_file: .env

    environment:
      WAHA_URL: http://waha:3000
      # Caminhos internos do container — sempre fixos
      MUSICAS_DIR: /app/workspace/musicas
      ACERVO_DIR: /app/workspace/musicas/acervo_limpo
      FILA_ZARA_DIR: /app/workspace/musicas/fila_zara
      QUEUE_DIR: /app/workspace/musicas/queue_pedidos
      TEMP_DIR: /app/workspace/temp
      # Pasta do CurrentSong.txt dentro do container (o host é montado via volume abaixo)
      CURRENT_SONG_DIR: /app/workspace/current_song
      # Extração do YouTube — trocáveis pelo .env sem rebuild quando um cliente cair
      POT_PROVIDER_URL: ${POT_PROVIDER_URL:-http://bgutil-pot:4416}
      YT_PLAYER_CLIENT: ${YT_PLAYER_CLIENT:-tv_simply}
      # Sem isto o stdout fica em buffer de bloco e o log some se o container morrer
      PYTHONUNBUFFERED: "1"

    volumes:
      # Named volume — Docker gerencia internamente, sem caminho Windows
      - temp:/app/workspace/temp
      # Bind mount — pasta raiz de músicas acessível pelo Windows e ZaraRadio
      # Defina MUSICAS_DIR no .env com barras normais. Exemplo: C:/LUZ FM/AR/MUSICAS
      - type: bind
        source: ${MUSICAS_DIR:-./workspace/musicas}
        target: /app/workspace/musicas
      # Bind mount — pasta onde o ZaraRadio grava CurrentSong.txt
      # Defina CURRENT_SONG_DIR no .env com o caminho Windows. Exemplo: C:/Users/user
      - type: bind
        source: ${CURRENT_SONG_DIR:-./workspace/current_song}
        target: /app/workspace/current_song

    depends_on:
      - waha
      - bgutil-pot

    networks:
      - agente_net

  # --- Provedor de PO Token (downloads do YouTube) ---
  # O YouTube exige um PO Token na requisição de mídia. Sem este serviço o
  # yt-dlp não consegue baixar nada e todo pedido novo vira erro_tecnico.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot
    restart: unless-stopped
    networks:
      - agente_net

  # --- Uptime Kuma (monitoramento) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - agente_net

networks:
  agente_net:
    driver: bridge

volumes:
  waha_sessions:
  temp:
  uptime_kuma_data:
