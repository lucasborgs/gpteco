# ============================================================
# Agente Virtual Musical — Stack completa
# ============================================================
# WAHA     — WhatsApp HTTP API     (porta 3001)
# servidor — FastAPI + pipeline    (porta 8002)
# ============================================================
# Iniciar:   docker compose up -d
# Rebuild:   docker compose build servidor
# Parar:     docker compose down
# Logs:      docker compose logs -f servidor
# Dashboard: http://localhost:3001/dashboard
# ============================================================

services:

  # --- WAHA (WhatsApp HTTP API) ---
  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64        # necessário para Mac Apple Silicon e emulação Windows
    container_name: waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Autenticação da API
      WHATSAPP_API_KEY: minhaChave123

      # Dashboard web (QR code e gerenciamento)
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: minhaChave123

      # Webhook → servidor Python (nome do serviço na rede interna Docker)
      WHATSAPP_HOOK_URL: http://servidor:8002/webhook
      WHATSAPP_HOOK_EVENTS: "message,session.status"

      # Engine NOWEB = Baileys (mais leve, sem Chrome)
      WHATSAPP_DEFAULT_ENGINE: NOWEB

      # NOWEB store — necessário para resolver LID → telefone
      WHATSAPP_NOWEB_STORE_ENABLED: "true"
      WHATSAPP_NOWEB_STORE_FULL_SYNC: "true"

      # Iniciar automaticamente a sessão "default"
      WHATSAPP_START_SESSION: default

      # Timezone
      TZ: America/Sao_Paulo

    volumes:
      - waha_sessions:/app/.sessions

    networks:
      - agente_net

  # --- Servidor Python (FastAPI + pipeline) ---
  servidor:
    build: .
    container_name: servidor
    restart: unless-stopped
    init: true                     # evita processos zumbi (ffmpeg/yt-dlp)
    ports:
      - "8002:8002"

    # Carrega todas as variáveis do arquivo .env
    env_file: .env

    environment:
      # Sobrescreve WAHA_URL do .env para comunicação interna Docker
      # (porta interna 3000 do container waha, não a 3001 mapeada no host)
      WAHA_URL: http://waha:3000
      # CURRENT_SONG_DIR do .env é o path Windows (usado como volume source acima).
      # O container precisa ver o path interno fixo onde o volume foi montado.
      CURRENT_SONG_DIR: /app/workspace/current_song

    volumes:
      # Código-fonte — bind mount: mudanças em .py requerem apenas restart
      - .:/app
      # Diretórios configuráveis via .env — cada cliente aponta para suas pastas reais
      # Padrões de desenvolvimento: ./workspace/...  (subpastas locais)
      # Produção Windows: C:\Radio\... (conforme DB_PATH/ACERVO_DIR/etc. no .env)
      - ${ACERVO_DIR:-./workspace/acervo_limpo}:/app/workspace/acervo_limpo
      - ${FILA_ZARA_DIR:-./workspace/fila_zara}:/app/workspace/fila_zara
      - ${QUEUE_DIR:-./workspace/queue_pedidos}:/app/workspace/queue_pedidos
      - ${TEMP_DIR:-./workspace/temp}:/app/workspace/temp
      - ${DATA_DIR:-./data}:/app/data
      # Pasta onde o ZaraRadio grava CurrentSong.txt (ex: C:\Users\user)
      - ${CURRENT_SONG_DIR:-./workspace/current_song}:/app/workspace/current_song
      # Modelo Whisper — volume nomeado para não baixar a cada rebuild
      - whisper_cache:/root/.cache/whisper

    depends_on:
      - waha

    networks:
      - agente_net

  # --- Uptime Kuma (monitoramento) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - agente_net

networks:
  agente_net:
    driver: bridge

volumes:
  waha_sessions:
  whisper_cache:
  uptime_kuma_data:
